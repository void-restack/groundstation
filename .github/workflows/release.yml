name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, ext: "" }
          - { os: macos-13, target: darwin-x64, ext: "" }
          - { os: macos-14, target: darwin-arm64, ext: "" }
          - { os: windows-latest, target: windows-x64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun build --compile --minify ./src/index.tsx --outfile gnd-${{ matrix.target }}${{ matrix.ext }}
      - run: ./gnd-${{ matrix.target }}${{ matrix.ext }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: gnd-${{ matrix.target }}
          path: gnd-${{ matrix.target }}${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/gnd-*
          generate_release_notes: true
