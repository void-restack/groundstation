name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, ext: "" }
          - { os: macos-15, target: darwin-arm64, ext: "" }
          - { os: windows-latest, target: windows-x64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun build --compile --minify ./src/index.tsx --outfile gnd-${{ matrix.target }}${{ matrix.ext }}
      - run: ./gnd-${{ matrix.target }}${{ matrix.ext }} --version
      - uses: actions/upload-artifact@v6
        with:
          name: gnd-${{ matrix.target }}
          path: gnd-${{ matrix.target }}${{ matrix.ext }}

  package-linux:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: gnd-linux-x64
      - name: Build deb / rpm / arch packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          chmod +x gnd-linux-x64
          mkdir -p dist
          for pkg in deb rpm archlinux; do
            docker run --rm -v "$PWD:/w" -w /w -e VERSION \
              ghcr.io/goreleaser/nfpm:latest package --config nfpm.yaml --packager "$pkg" --target dist/
          done
          ls -la dist
      - uses: actions/upload-artifact@v6
        with:
          name: linux-packages
          path: dist/*

  release:
    needs: [build, package-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/gnd-*
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          generate_release_notes: true
